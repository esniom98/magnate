<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostica rete</title>
</head>
<body style="background:#1C1B1A; color:#F5F0E8; font-family:monospace; padding:16px; font-size:13px; line-height:1.6;">
<h2 style="font-family:sans-serif; font-weight:normal;">Diagnostica rete generale</h2>
<div id="log">In corso...</div>

<script>
const log = document.getElementById('log');
function addLine(text, color){
  const div = document.createElement('div');
  div.style.marginBottom = '10px';
  div.style.color = color || '#B8B2A6';
  div.style.wordBreak = 'break-word';
  div.textContent = text;
  log.appendChild(div);
}
log.innerHTML = '';

async function testUrl(name, url, opts){
  addLine('--- ' + name + ' ---', '#C9A253');
  try{
    const res = await fetch(url, opts||{});
    addLine('OK - stato HTTP: ' + res.status, '#5C8570');
  }catch(e){
    addLine('FALLITO: ' + e.message, '#B0524F');
  }
}

async function run(){
  await testUrl('jsonplaceholder.typicode.com (servizio di test molto noto)', 'https://jsonplaceholder.typicode.com/todos/1');
  await testUrl('httpbin.org (altro servizio di test noto)', 'https://httpbin.org/get');
  await testUrl('key-value.co homepage (non API, solo la pagina)', 'https://key-value.co/', { mode: 'no-cors' });
  await testUrl('key-value.co/api/generate', 'https://key-value.co/api/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({})
  });
  addLine('--- FINE TEST ---', '#C9A253');
}
run();
</script>
</body>
</html>
