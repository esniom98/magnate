<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostica salvataggio</title>
</head>
<body style="background:#1C1B1A; color:#F5F0E8; font-family:monospace; padding:16px; font-size:13px; line-height:1.6;">
<h2 style="font-family:sans-serif; font-weight:normal;">Diagnostica key-value.co</h2>
<div id="log">In corso...</div>

<script>
const log = document.getElementById('log');
function addLine(text, color){
  const div = document.createElement('div');
  div.style.marginBottom = '10px';
  div.style.color = color || '#B8B2A6';
  div.style.wordBreak = 'break-word';
  div.textContent = text;
  log.appendChild(div);
}
log.innerHTML = '';

async function run(){
  addLine('--- TEST 1: chiamata /api/generate (formato ufficiale) ---', '#C9A253');
  try{
    const res = await fetch('https://key-value.co/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });
    const text = await res.text();
    addLine('Stato HTTP: ' + res.status);
    addLine('Risposta: ' + text);
  }catch(e){
    addLine('ERRORE DI RETE: ' + e.message, '#B0524F');
  }

  addLine('--- TEST 2: store con token esadecimale finto ---', '#C9A253');
  const fakeToken = 'a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2';
  try{
    const res = await fetch('https://key-value.co/api/store', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-KV-Token': fakeToken },
      body: JSON.stringify({ data: { test: true } })
    });
    const text = await res.text();
    addLine('Stato HTTP: ' + res.status);
    addLine('Risposta: ' + text);
  }catch(e){
    addLine('ERRORE DI RETE: ' + e.message, '#B0524F');
  }

  addLine('--- TEST 3: retrieve con lo stesso token esadecimale ---', '#C9A253');
  try{
    const res = await fetch('https://key-value.co/api/retrieve', {
      headers: { 'X-KV-Token': fakeToken }
    });
    const text = await res.text();
    addLine('Stato HTTP: ' + res.status);
    addLine('Risposta: ' + text);
  }catch(e){
    addLine('ERRORE DI RETE: ' + e.message, '#B0524F');
  }

  addLine('--- FINE TEST ---', '#5C8570');
}
run();
</script>
</body>
</html>
