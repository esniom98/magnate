<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup salvataggio</title>
</head>
<body style="background:#1C1B1A; color:#F5F0E8; font-family:monospace; padding:16px; font-size:13px; line-height:1.7;">
<h2 style="font-family:sans-serif; font-weight:normal;">Creazione bin di salvataggio</h2>
<div id="log">In corso...</div>

<script>
const log = document.getElementById('log');
function addLine(text, color){
  const div = document.createElement('div');
  div.style.marginBottom = '12px';
  div.style.color = color || '#B8B2A6';
  div.style.wordBreak = 'break-word';
  div.textContent = text;
  log.appendChild(div);
}
log.innerHTML = '';

const MASTER_KEY = '$2a$10$TE98qegu/kbMgbWgvUMtJungTPgKqj2sb/GLgge4HsFxRQHP/ejYa';

async function run(){
  addLine('Chiamata a api.jsonbin.io/v3/b (creazione bin)...', '#C9A253');
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY,
        'X-Bin-Name': 'magnate-save'
      },
      body: JSON.stringify({ cash: 30, business: {}, staff: {}, stocks: {}, properties: {}, placeholder: true })
    });
    const text = await res.text();
    addLine('Stato HTTP: ' + res.status, res.ok ? '#5C8570' : '#B0524F');
    addLine('Risposta completa: ' + text);

    if(res.ok){
      const json = JSON.parse(text);
      const binId = json.metadata && json.metadata.id;
      if(binId){
        addLine('--- BIN CREATO CON SUCCESSO ---', '#5C8570');
        addLine('ID DEL BIN (importante, copialo): ' + binId, '#C9A253');
      }
    }
  }catch(e){
    addLine('ERRORE DI RETE: ' + e.message, '#B0524F');
  }
}
run();
</script>
</body>
</html>
